name: Quality checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  reusable-quality:
    name: Reusable static quality
    uses: AlexFrigenti/project-quality/.github/workflows/static-quality.yml@e192175546e6528b593f48edcac86e8f01af4e13
    with:
      standard-version: v1.1.0
      standard-sha: e192175546e6528b593f48edcac86e8f01af4e13
      node-version: "22.13.0"
      validation-command: |
        node --check scripts/app.js
        node --check registro.js
        node --check sw.js
        node scripts/validate-quality.mjs
